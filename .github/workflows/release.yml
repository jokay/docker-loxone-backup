name: release

on:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.push.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version
        run: cog --config .github/release/cog.toml bump --auto
      - name: Push commit and tag
        id: push
        run: |
          TAG=$(git describe --tags --abbrev=0)
          git push --atomic origin main "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  create:
    needs:
      - bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
          SHA: ${{ needs.bump.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          CHANGELOG="https://github.com/${REPO}/blob/main/CHANGELOG.md"
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "${TAG}" \
            --target "${SHA}" \
            --notes "Please refer to [CHANGELOG.md](${CHANGELOG}) for details."
